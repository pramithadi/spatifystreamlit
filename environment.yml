name: spatify
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - gdal
  - geopandas=0.14.0
  - rasterio=1.3.6
  - folium=0.15.0
  - streamlit=1.46.0
  - pandas=2.2.3
  - numpy=1.26.4
  - shapely<2.0
  - pyproj=3.4.1
  - scikit-learn=1.4.2
  - scikit-image=0.22.0
  - matplotlib
  - seaborn
  - pillow
  - plotly
  - requests
  - pip
  - pip:
      - streamlit-folium==0.15.0
      - streamlit-aggrid
      - streamlit-image-comparison
      - python-decouple
